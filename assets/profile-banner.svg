<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="16"
        flood-color="#000000"
        flood-opacity=".45"
      />
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path
        d="M36 0H0V36"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".055"
        stroke-width="1"
      />
    </pattern>
  </defs>

  <rect
    width="1200"
    height="300"
    rx="28"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="300"
    rx="28"
    fill="url(#grid)"
  />

  <circle
    cx="1060"
    cy="55"
    r="240"
    fill="url(#glow1)"
  />

  <circle
    cx="180"
    cy="270"
    r="240"
    fill="url(#glow2)"
  />

  <g opacity=".85">
    <circle cx="100" cy="75" r="5" fill="#22d3ee"/>
    <circle cx="125" cy="75" r="5" fill="#a78bfa"/>
    <circle cx="150" cy="75" r="5" fill="#f8fafc"/>

    <path
      d="M100 105H1100"
      stroke="#ffffff"
      stroke-opacity=".12"
    />
  </g>

  <g filter="url(#shadow)">
    <text
      x="80"
      y="175"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="58"
      font-weight="800"
      fill="#f8fafc"
    >
      Mohamed AbdElkareem
    </text>

    <text
      x="83"
      y="220"
      font-family="JetBrains Mono, Consolas, monospace"
      font-size="23"
      font-weight="600"
      fill="#67e8f9"
    >
      CLOUD · DEVOPS · PLATFORM ENGINEERING
    </text>
  </g>

  <g transform="translate(915 112)">
    <rect
      x="0"
      y="0"
      width="210"
      height="92"
      rx="16"
      fill="#020617"
      fill-opacity=".55"
      stroke="#67e8f9"
      stroke-opacity=".35"
    />

    <text
      x="22"
      y="34"
      font-family="JetBrains Mono, Consolas, monospace"
      font-size="15"
      fill="#94a3b8"
    >
      $ platform status
    </text>

    <text
      x="22"
      y="65"
      font-family="JetBrains Mono, Consolas, monospace"
      font-size="17"
      font-weight="700"
      fill="#4ade80"
    >
      ● OPERATIONAL
    </text>
  </g>
</svg>
